<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <noscript>
    <meta http-equiv="refresh" content="0; url=?noscript">
  </noscript>
  <link rel="icon" type="image/x-icon" href="__ASSETS_PREFIX__favicon.ico">
  <link rel="stylesheet" href="__ASSETS_PREFIX__index.css">
</head>

<body>
  <div class="app-shell">
    <header class="head">
      <div class="toolbox-mobile">
        <button type="button" class="toolbox-mobile-trigger" aria-label="Menu" aria-expanded="false"
          aria-controls="toolbox-menu" title="Menu">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M2 3.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5zm0 4a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5zm0 4a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z" />
          </svg>
        </button>
        <div class="toolbox-mobile-menu" id="toolbox-menu"></div>
      </div>

      <nav class="breadcrumb-wrap" aria-label="Breadcrumb">
        <div class="breadcrumb"></div>
      </nav>

      <div class="toolbox">
        <a href="" class="control download hidden" title="Download file" download="">
          <svg width="16" height="16" viewBox="0 0 16 16">
            <path
              d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z" />
            <path
              d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z" />
          </svg>
          <span class="control-label">Download</span>
        </a>
        <div class="control move-file hidden" title="Move & Rename">
          <svg class="icon-move" width="16" height="16" viewBox="0 0 16 16">
            <path fill-rule="evenodd"
              d="M1.5 1.5A.5.5 0 0 0 1 2v4.8a2.5 2.5 0 0 0 2.5 2.5h9.793l-3.347 3.346a.5.5 0 0 0 .708.708l4.2-4.2a.5.5 0 0 0 0-.708l-4-4a.5.5 0 0 0-.708.708L13.293 8.3H3.5A1.5 1.5 0 0 1 2 6.8V2a.5.5 0 0 0-.5-.5z">
            </path>
          </svg>
          <span class="control-label">Move</span>
        </div>
        <div class="control delete-file hidden" title="Delete">
          <svg class="icon-delete" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path
              d="M6.854 7.146a.5.5 0 1 0-.708.708L7.293 9l-1.147 1.146a.5.5 0 0 0 .708.708L8 9.707l1.146 1.147a.5.5 0 0 0 .708-.708L8.707 9l1.147-1.146a.5.5 0 0 0-.708-.708L8 8.293 6.854 7.146z" />
            <path
              d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5v2z" />
          </svg>
          <span class="control-label">Delete</span>
        </div>
        <div class="control upload-file hidden" title="Upload files/folders">
          <label for="file">
            <svg width="16" height="16" viewBox="0 0 16 16">
              <path
                d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z" />
              <path
                d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z" />
            </svg>
            <span class="control-label">Upload</span>
          </label>
          <input type="file" id="file" title="Upload files/folders" name="file" multiple>
        </div>
        <div class="control new-folder hidden" title="New folder">
          <svg width="16" height="16" viewBox="0 0 16 16">
            <path
              d="m.5 3 .04.87a1.99 1.99 0 0 0-.342 1.311l.637 7A2 2 0 0 0 2.826 14H9v-1H2.826a1 1 0 0 1-.995-.91l-.637-7A1 1 0 0 1 2.19 4h11.62a1 1 0 0 1 .996 1.09L14.54 8h1.005l.256-2.819A2 2 0 0 0 13.81 3H9.828a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 6.172 1H2.5a2 2 0 0 0-2 2zm5.672-1a1 1 0 0 1 .707.293L7.586 3H2.19c-.24 0-.47.042-.683.12L1.5 2.98a1 1 0 0 1 1-.98h3.672z" />
            <path
              d="M13.5 10a.5.5 0 0 1 .5.5V12h1.5a.5.5 0 1 1 0 1H14v1.5a.5.5 0 1 1-1 0V13h-1.5a.5.5 0 0 1 0-1H13v-1.5a.5.5 0 0 1 .5-.5z" />
          </svg>
          <span class="control-label">New folder</span>
        </div>
        <div class="control new-file hidden" title="New File">
          <svg width="16" height="16" viewBox="0 0 16 16">
            <path
              d="M8 6.5a.5.5 0 0 1 .5.5v1.5H10a.5.5 0 0 1 0 1H8.5V11a.5.5 0 0 1-1 0V9.5H6a.5.5 0 0 1 0-1h1.5V7a.5.5 0 0 1 .5-.5z" />
            <path
              d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5h-2z" />
          </svg>
          <span class="control-label">New file</span>
        </div>
        <a href="" class="control up-button hidden" title="Go to parent folder">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g id="bgCarrier" stroke-width="0"></g>
            <g id="tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
            <g id="iconCarrier">
              <path d="M4 10L3.29289 10.7071L2.58579 10L3.29289 9.29289L4 10ZM21 18C21 18.5523 20.5523 19 20 19C19.4477 19 19 18.5523 19 18L21 18ZM8.29289 15.7071L3.29289 10.7071L4.70711 9.29289L9.70711 14.2929L8.29289 15.7071ZM3.29289 9.29289L8.29289 4.29289L9.70711 5.70711L4.70711 10.7071L3.29289 9.29289ZM4 9L14 9L14 11L4 11L4 9ZM21 16L21 18L19 18L19 16L21 16ZM14 9C17.866 9 21 12.134 21 16L19 16C19 13.2386 16.7614 11 14 11L14 9Z"></path>
            </g>
          </svg>
          <span class="control-label">Parent</span>
        </a>
      </div>

      <form class="searchbar hidden" role="search">
        <div class="icon">
          <svg width="16" height="16" viewBox="0 0 16 16">
            <path
              d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
          </svg>
        </div>
        <input id="search" title="Searching for folders or files" aria-label="Search" name="q" type="text" maxlength="128"
          autocomplete="off" tabindex="1">
        <input type="submit" hidden />
      </form>

      <div class="toolbox-right">
        <div class="toolbox-actions">
          <div class="theme-switch" role="group" aria-label="Theme selector">
            <button type="button" class="theme-btn active" data-theme-toggle="auto" aria-pressed="true">Auto</button>
            <button type="button" class="theme-btn" data-theme-toggle="light" aria-pressed="false">Light</button>
            <button type="button" class="theme-btn" data-theme-toggle="dark" aria-pressed="false">Dark</button>
          </div>
          <button type="button" class="control theme-cycle" data-theme-cycle aria-label="Theme: auto"
            title="Theme: auto">
            <svg class="icon-auto" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="5.5" />
              <path class="theme-icon-fill" d="M8 2.5a5.5 5.5 0 0 1 0 11z" />
            </svg>
            <svg class="icon-light" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="3" />
              <path d="M8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" />
            </svg>
            <svg class="icon-dark" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M13.5 9.6A5.7 5.7 0 0 1 6.4 2.5a5.7 5.7 0 1 0 7.1 7.1z" />
            </svg>
          </button>
          <div class="login-btn hidden" title="Login">
            <svg width="16" height="16" viewBox="0 0 16 16">
              <path fill-rule="evenodd"
                d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0v-2z" />
              <path fill-rule="evenodd"
                d="M11.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z" />
            </svg>
          </div>
          <div class="save-btn hidden" title="Save file">
            <svg viewBox="0 0 1024 1024" width="24" height="24">
              <path
                d="M426.666667 682.666667v42.666666h170.666666v-42.666666h-170.666666z m-42.666667-85.333334h298.666667v128h42.666666V418.133333L605.866667 298.666667H298.666667v426.666666h42.666666v-128h42.666667z m260.266667-384L810.666667 379.733333V810.666667H213.333333V213.333333h430.933334zM341.333333 341.333333h85.333334v170.666667H341.333333V341.333333z"
                p-id="8311"></path>
            </svg>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="index-page hidden">
        <div class="empty-folder hidden"></div>
        <table class="uploaders-table hidden">
          <thead>
            <tr>
              <th class="cell-name">Name</th>
              <th class="cell-status">Progress</th>
            </tr>
          </thead>
        </table>
        <table class="paths-table hidden">
          <thead>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
      <div class="editor-page hidden">
        <div class="not-editable hidden"></div>
        <textarea id="editor" class="editor hidden" aria-label="Editor" cols="10"></textarea>
      </div>
    </main>
  </div>
  <template id="index-data">__INDEX_DATA__</template>
  <script src="__ASSETS_PREFIX__index.js"></script>
</body>

</html>
